<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Survival</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/game/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="grid"></div>
      <aside id="hud">
        <dl>
          <dt>Position</dt>
          <dd id="position"></dd>
          <dt>Terrain</dt>
          <dd id="terrain"></dd>
        </dl>
        <p id="live" aria-live="polite"></p>
        <p>
          Goal: Make a campfire, wet 5 leaves beside water,
          then craft a signal fire to get rescued.
        </p>
        <h2>Inventory</h2>
        <h2 id="ending" hidden>Your signal was spotted. You are rescued!</h2>
        <ul id="inventory"></ul>
        <h2>Crafting</h2>
        <ul id="recipes"></ul>
        <button id="mute" type="button" aria-pressed="false">Sound: on</button>
      </aside>
    </main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
